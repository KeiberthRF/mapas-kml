<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geoportal SIG - Efectos Territoriales y Capas</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; overflow: hidden; }
    #map { height: 100vh; width: 100vw; z-index: 1; }

    #floating-panel {
      position: absolute; top: 15px; right: 15px; z-index: 1100;
      background: rgba(15, 23, 42, 0.94); backdrop-filter: blur(10px);
      padding: 16px; border-radius: 12px; border: 1px solid #334155;
      width: 300px; color: #fff; box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      display: flex; flex-direction: column; gap: 10px;
    }

    .panel-header { font-size: 12px; font-weight: 800; color: #38bdf8; border-bottom: 1px solid #334155; padding-bottom: 6px; }
    label { font-size: 10px; text-transform: uppercase; color: #94a3b8; font-weight: 700; }
    select, input { padding: 8px 10px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 12px; outline: none; width: 100%; }

    .btn-reset { background: #334155; color: #fff; border: 1px solid #475569; padding: 8px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
    .btn-reset:hover { background: #0284c7; }

    /* Estilo Tooltip estilo Geoportal */
    .geo-tooltip {
      background: rgba(15, 23, 42, 0.95) !important;
      border: 1px solid #38bdf8 !important;
      color: #fff !important;
      border-radius: 8px !important;
      padding: 8px 12px !important;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5) !important;
    }
    .geo-title { font-weight: 800; font-size: 13px; color: #38bdf8; }
    .geo-stat { font-size: 11px; color: #cbd5e1; margin-top: 2px; }
  </style>
</head>
<body>

  <div id="floating-panel">
    <div class="panel-header">GEOPORTAL ESTADÍSTICO - CAPAS</div>
    
    <label for="select-depto">Departamento</label>
    <select id="select-depto"><option value="todos">Todos los Departamentos</option></select>

    <label for="select-muni">Municipio</label>
    <select id="select-muni"><option value="todos">Todos los Municipios</option></select>

    <button class="btn-reset" onclick="resetView()">🧹 Vista Panorámica General</button>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@tmcw/togeojson@5.8.1/dist/togeojson.umd.js"></script>

  <script>
    var map = L.map('map', { maxZoom: 20 }).setView([14.6, -87.8], 8);

    L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
      maxZoom: 20, attribution: '© Google Earth'
    }).addTo(map);

    var hondurasDeptosGeoJSON = null, hondurasMunisGeoJSON = null;
    var boundaryLayer = null;

    // Cargar Geometrías Territoriales
    Promise.all([
      fetch('https://raw.githubusercontent.com/wmgeolab/geoBoundaries/9469f09/releaseData/gbOpen/HND/ADM1/geoBoundaries-HND-ADM1_simplified.geojson').then(r => r.json()),
      fetch('https://raw.githubusercontent.com/wmgeolab/geoBoundaries/9469f09/releaseData/gbOpen/HND/ADM2/geoBoundaries-HND-ADM2_simplified.geojson').then(r => r.json())
    ]).then(([deptos, munis]) => {
      hondurasDeptosGeoJSON = deptos;
      hondurasMunisGeoJSON = munis;

      var selectDepto = document.getElementById('select-depto');
      deptos.features.forEach(f => {
        var name = f.properties.shapeName;
        var opt = document.createElement('option');
        opt.value = name; opt.textContent = name;
        selectDepto.appendChild(opt);
      });
    });

    // Función para renderizar el efecto del croquis coloreado
    function renderGeoLayer(depto, muni) {
      if (boundaryLayer) map.removeLayer(boundaryLayer);
      if (depto === 'todos') return;

      var targetFeatures = [];
      var isMuniMode = (muni !== 'todos');

      if (isMuniMode && hondurasMunisGeoJSON) {
        targetFeatures = hondurasMunisGeoJSON.features.filter(f => 
          (f.properties.shapeName || "").toLowerCase().includes(muni.toLowerCase())
        );
      } else if (hondurasDeptosGeoJSON) {
        targetFeatures = hondurasDeptosGeoJSON.features.filter(f => 
          (f.properties.shapeName || "").toLowerCase().includes(depto.toLowerCase())
        );
      }

      if (targetFeatures.length > 0) {
        boundaryLayer = L.geoJSON(targetFeatures, {
          style: function() {
            return {
              color: '#38bdf8',
              weight: 3,
              opacity: 0.9,
              fillColor: '#0284c7',
              fillOpacity: 0.3,
              dashArray: '4, 4'
            };
          },
          onEachFeature: function(feature, layer) {
            var name = feature.properties.shapeName || "Zona Territorio";
            var tooltipHtml = `
              <div class="geo-title">${name}</div>
              <div class="geo-stat">Territorio Delimitado Activo</div>
            `;
            layer.bindTooltip(tooltipHtml, { permanent: false, className: 'geo-tooltip', direction: 'top' });
          }
        }).addTo(map);

        map.flyToBounds(boundaryLayer.getBounds(), { padding: [50, 50], duration: 1.8 });
      }
    }

    document.getElementById('select-depto').addEventListener('change', function() {
      renderGeoLayer(this.value, 'todos');
    });

    document.getElementById('select-muni').addEventListener('change', function() {
      renderGeoLayer(document.getElementById('select-depto').value, this.value);
    });

    function resetView() {
      document.getElementById('select-depto').value = 'todos';
      document.getElementById('select-muni').value = 'todos';
      if (boundaryLayer) map.removeLayer(boundaryLayer);
      map.flyTo([14.6, -87.8], 8, { duration: 2.0 });
    }
  </script>
</body>
</html>
