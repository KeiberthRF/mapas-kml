<!DOCTYPE html>
<html lang="es">
<head>
  <title>Mapa Productores de Aguacate de Honduras</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Estilos de Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
    #map { height: 100vh; width: 100vw; }

    /* Estilo del recuadro emergente informativo */
    .leaflet-popup-content-wrapper {
      border-radius: 6px;
      padding: 12px;
      max-height: 420px;
      max-width: 380px;
      overflow-y: auto;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .leaflet-popup-content {
      margin: 0;
      font-size: 13px;
      line-height: 1.5;
      color: #222;
    }
    .leaflet-popup-content h3 {
      margin: 0 0 10px 0;
      color: #1a237e;
      font-size: 16px;
      border-bottom: 2px solid #2e7d32;
      padding-bottom: 4px;
    }
    .leaflet-popup-content a {
      color: #0d47a1;
      font-weight: bold;
      word-break: break-all;
      text-decoration: underline;
    }
    .leaflet-popup-content table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 5px;
    }
    .leaflet-popup-content td {
      padding: 4px;
      border-bottom: 1px solid #eee;
    }

    #status-msg {
      position: absolute;
      top: 10px;
      left: 50px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.9);
      padding: 8px 15px;
      border-radius: 5px;
      font-weight: bold;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <div id="status-msg">Cargando datos del KML...</div>
  <div id="map"></div>

  <!-- Librerías Leaflet y Conversor KML -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@tmcw/togeojson@5.8.1/dist/togeojson.umd.js"></script>

  <script>
    var statusDiv = document.getElementById('status-msg');

    // Inicialización del mapa centrada en Honduras
    var map = L.map('map', {
      maxZoom: 20
    }).setView([14.6, -87.8], 8);

    // Capa de mapa satelital de Google
    L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: '© Google Earth'
    }).addTo(map);

    // Función segura para activar enlaces de KoboToolbox en la descripción
    function autolink(text) {
      if (!text) return "";
      
      // Convertir a texto por si viene como objeto o HTML
      var str = typeof text === 'string' ? text : String(text);
      if (typeof text === 'object' && text.value) {
        str = String(text.value);
      }

      var exp = /(\b(https?|ftp|file):\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])/ig;
      return str.replace(exp, "<a href='$1' target='_blank'>Abrir Enlace KoboToolbox</a>");
    }

    var urlKML = './honduras.kml';

    fetch(urlKML, { cache: 'no-cache' })
      .then(function(response) {
        if (!response.ok) {
          throw new Error('No se encontró el archivo honduras.kml (Estado HTTP: ' + response.status + ')');
        }
        return response.text();
      })
      .then(function(kmlText) {
        var parser = new DOMParser();
        var kmlDom = parser.parseFromString(kmlText, 'text/xml');
        
        var parserError = kmlDom.querySelector('parsererror');
        if (parserError) {
          throw new Error('El archivo honduras.kml contiene errores de sintaxis XML.');
        }

        var geojson = toGeoJSON.kml(kmlDom);

        if (!geojson.features || geojson.features.length === 0) {
          statusDiv.innerText = 'El archivo KML se cargó, pero no contiene elementos/puntos válidos.';
          return;
        }

        var kmlLayer = L.geoJSON(geojson, {
          pointToLayer: function (feature, latlng) {
            // Dibuja puntos en color rojo brillante para asegurar visibilidad
            return L.circleMarker(latlng, {
              radius: 7,
              fillColor: "#ff3300",
              color: "#ffffff",
              weight: 2,
              opacity: 1,
              fillOpacity: 0.9
            });
          },
          onEachFeature: function(feature, layer) {
            var props = feature.properties || {};
            var nombre = props.name || "Productor sin nombre";
            var descripcion = props.description || "";

            var popupContent = "<h3>" + nombre + "</h3>";

            if (descripcion) {
              popupContent += "<div>" + autolink(descripcion) + "</div>";
            }

            layer.bindPopup(popupContent);

            layer.bindTooltip(nombre, {
              permanent: false,
              direction: 'top'
            });
          }
        }).addTo(map);

        if (kmlLayer.getBounds().isValid()) {
          map.fitBounds(kmlLayer.getBounds());
          statusDiv.style.display = 'none';
        } else {
          statusDiv.innerText = 'Puntos cargados pero las coordenadas no son válidas.';
        }
      })
      .catch(function(error) {
        console.error('Error al cargar KML:', error);
        statusDiv.innerText = 'Error al cargar KML: ' + error.message;
      });
  </script>
</body>
</html>
