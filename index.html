<!DOCTYPE html>
<html>
<head>
  <title>Mapa Productores de Aguacate de Honduras</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Estilos de Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
    #map { height: 100vh; width: 100vw; }

    /* Ventana emergente AMPLIADA tipo Google Earth */
    .leaflet-popup-content-wrapper {
      border-radius: 8px;
      padding: 15px;
      max-height: 550px;
      width: 480px;
      max-width: 85vw;
      overflow-y: auto;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .leaflet-popup-content {
      margin: 0;
      font-size: 13px;
      line-height: 1.6;
      color: #222;
    }
    .leaflet-popup-content h3 {
      margin: 0 0 12px 0;
      color: #1a237e;
      font-size: 16px;
      border-bottom: 2px solid #2e7d32;
      padding-bottom: 6px;
    }
    .leaflet-popup-content a {
      color: #0d47a1;
      font-weight: bold;
      word-break: break-all;
      text-decoration: underline;
    }
    .leaflet-popup-content table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 5px;
    }
    .leaflet-popup-content td {
      padding: 4px;
      border-bottom: 1px solid #eee;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Librerías Leaflet y Lector Omnivore KML -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Inicialización del mapa
    var map = L.map('map', {
      maxZoom: 20
    }).setView([14.6, -87.8], 8);

    // 1. Capa Satelital Google (Alta Nitidez)
    var googleSatelite = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: '© Google Earth'
    });

    // 2. Capa Satelital Google con Etiquetas HD
    var googleHibrido = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: '© Google Earth'
    }).addTo(map);

    // 3. Capa Satelital Esri HD
    var esriSatelite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: '© Esri World Imagery'
    });

    // Selector de capas
    var baseMaps = {
      "Google Satélite + Etiquetas HD": googleHibrido,
      "Google Satélite Solo HD": googleSatelite,
      "Esri Satélite HD": esriSatelite
    };
    L.control.layers(baseMaps).addTo(map);

    // Función para activar hipervínculos de KoboToolbox
    function autolink(text) {
      if (!text) return "";
      var exp = /(\b(https?|ftp|file):\/\/[-A-Z0-9+&@#\/%?=_|!:,.;]*[-A-Z0-9+&@#\/%=_|])/ig;
      return text.replace(exp, "<a href='$1' target='_blank'>Abrir Enlace KoboToolbox</a>");
    }

    // Procesa los datos GeoJSON
    function procesarGeoJSON(geojson) {
      var kmlLayer = L.geoJSON(geojson, {
        onEachFeature: function(feature, layer) {
          var props = feature.properties || {};
          var nombre = props.name || "Productor sin nombre";
          var descripcion = props.description || "";

          var popupContent = "<h3>" + nombre + "</h3>";

          if (descripcion) {
            popupContent += "<div>" + autolink(descripcion) + "</div>";
          }

          layer.bindPopup(popupContent, { maxWidth: 500 });
          layer.bindTooltip(nombre, { permanent: false, direction: 'top' });
        }
      }).addTo(map);

      if (kmlLayer.getBounds().isValid()) {
        map.fitBounds(kmlLayer.getBounds());
      }
    }

    // Método robusto para leer el KML desde el servidor sin fallos de lectura
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'honduras.kml', true);
    xhr.onload = function() {
      if (xhr.status === 200) {
        var parser = new DOMParser();
        var kmlDom = parser.parseFromString(xhr.responseText, 'text/xml');
        
        // Importar conversor dinámicamente si es necesario
        var script = document.createElement('script');
        script.src = 'https://unpkg.com/@tmcw/togeojson@5.8.1/dist/togeojson.umd.js';
        script.onload = function() {
          var geojson = toGeoJSON.kml(kmlDom);
          procesarGeoJSON(geojson);
        };
        document.head.appendChild(script);
      } else {
        console.error('Error al cargar el archivo KML. Código de respuesta:', xhr.status);
      }
    };
    xhr.send();
  </script>
</body>
</html>
