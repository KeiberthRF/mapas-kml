<!DOCTYPE html>
<html lang="es">
<head>
  <title>Mapa Productores de Aguacate de Honduras</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Estilos de Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { 
      margin: 0; 
      padding: 0; 
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
      background-color: #0f172a; 
      overflow: hidden;
    }
    #map { height: 100vh; width: 100vw; z-index: 1; }

    #status-msg {
      position: absolute;
      top: 10px;
      left: 50px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      color: #38bdf8;
      padding: 8px 15px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      border: 1px solid #1e293b;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      transition: opacity 0.5s ease;
    }

    #floating-search-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1090;
      background: #0284c7;
      color: #fff;
      border: 1px solid #38bdf8;
      padding: 10px 14px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: bold;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    #floating-search-btn:hover { 
      background: #0369a1; 
      transform: scale(1.08) translateY(-2px); 
      box-shadow: 0 6px 25px rgba(56, 189, 248, 0.4);
    }

    #side-panel {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1100;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(56, 189, 248, 0.2);
      box-shadow: 0 8px 32px rgba(0,0,0,0.7);
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 290px;
      max-height: calc(100vh - 30px);
      box-sizing: border-box;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #side-panel.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateX(120%) scale(0.95);
    }

    .panel-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 6px;
    }

    .panel-header-bar span {
      font-size: 11px;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 0.5px;
    }

    .btn-close-panel {
      background: #334155;
      color: #94a3b8;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .btn-close-panel:hover { background: #ef4444; color: #fff; transform: rotate(90deg); }

    #side-panel label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 700;
      color: #94a3b8;
    }

    #side-panel select {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      font-size: 13px;
      outline: none;
      width: 100%;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    #side-panel select:focus { border-color: #38bdf8; }

    .search-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    #search-input {
      flex: 1;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      font-size: 13px;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    #search-input:focus { border-color: #38bdf8; }

    .btn-clear-search {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .btn-clear-search:hover { background: #0284c7; border-color: #38bdf8; transform: rotate(-15deg); }

    .list-header {
      font-size: 11px;
      font-weight: bold;
      color: #38bdf8;
      border-bottom: 1px solid #334155;
      padding-bottom: 6px;
      margin-top: 2px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #producer-list-container { overflow-y: auto; max-height: 200px; }

    #producer-list {
      list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px;
    }

    #producer-list li {
      padding: 8px 10px; border-radius: 6px; cursor: pointer; background: #1e293b; border: 1px solid #334155;
      display: flex; flex-direction: column; gap: 2px; transition: all 0.25s ease;
    }

    #producer-list li .p-name { font-size: 12px; font-weight: 600; color: #f1f5f9; }
    #producer-list li .p-location { font-size: 10px; color: #38bdf8; }
    #producer-list li:hover { 
      background: #0284c7; 
      border-color: #38bdf8; 
      transform: translateX(-4px); 
    }

    .empty-prompt { font-size: 11px; color: #64748b; text-align: center; padding: 12px 5px; font-style: italic; }

    .admin-bar {
      display: flex; gap: 6px; margin-top: 4px; border-top: 1px solid #334155; padding-top: 8px;
    }

    .btn-admin {
      flex: 1; padding: 7px; border-radius: 6px; font-size: 11px; font-weight: bold; border: none; cursor: pointer; text-align: center;
      transition: all 0.2s;
    }

    .btn-users { background: #0ea5e9; color: #fff; }
    .btn-users:hover { background: #0284c7; }
    .btn-logout { background: #ef4444; color: #fff; }
    .btn-logout:hover { background: #dc2626; }

    /* Modal Administración */
    #admin-modal {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8); backdrop-filter: blur(6px); z-index: 2000; justify-content: center; align-items: center;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-content {
      background: #1e293b; border: 1px solid #475569; padding: 20px; border-radius: 12px; width: 94%; max-width: 720px; color: #fff; max-height: 85vh; overflow-y: auto;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }

    .modal-header-container {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #334155; padding-bottom: 6px; gap: 8px; flex-wrap: wrap; margin-top: 10px;
    }

    .modal-content h3 { color: #38bdf8; margin: 0; font-size: 14px; }

    .form-create-user {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #334155;
    }

    .form-create-user input, .form-create-user select {
      padding: 6px 10px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 12px;
    }

    .btn-add-user {
      grid-column: span 2; background: #16a34a; color: #fff; border: none; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px;
      transition: background 0.2s;
    }
    .btn-add-user:hover { background: #15803d; }

    .modal-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 15px; }
    .modal-table th, .modal-table td { padding: 6px 8px; border-bottom: 1px solid #334155; text-align: left; vertical-align: middle; }
    .modal-table th { color: #94a3b8; }

    .btn-delete-user {
      background: #ef4444; color: #fff; border: none; padding: 3px 8px; border-radius: 4px; font-size: 10px; cursor: pointer; font-weight: bold;
    }
    .btn-delete-user:hover { background: #dc2626; }

    .btn-toggle-pass {
      background: transparent; border: none; cursor: pointer; font-size: 12px; margin-left: 4px; padding: 2px; vertical-align: middle;
    }

    .btn-group-logs { display: flex; gap: 6px; }

    .btn-clear-logs {
      background: #d97706; color: #fff; border: none; padding: 5px 9px; border-radius: 4px; font-size: 10px; cursor: pointer; font-weight: bold;
    }
    .btn-clear-logs:hover { background: #b45309; }

    .btn-download-logs {
      background: #059669; color: #fff; border: none; padding: 5px 9px; border-radius: 4px; font-size: 10px; cursor: pointer; font-weight: bold;
    }
    .btn-download-logs:hover { background: #047857; }

    .btn-close-modal { background: #64748b; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; float: right; font-size: 12px; }

    .badge-status {
      padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 10px; display: inline-block;
    }
    .badge-exitoso { background: rgba(22, 163, 74, 0.2); color: #4ade80; border: 1px solid #16a34a; }
    .badge-fallido { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid #ef4444; }

    /* Marcador Google Earth con animación */
    .google-earth-marker {
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .google-earth-marker:hover {
      transform: scale(1.25) translateY(-5px) !important;
      z-index: 1000 !important;
    }

    /* Popup Emergente */
    .leaflet-popup-content-wrapper { 
      border-radius: 10px; 
      padding: 12px; 
      max-height: 420px; 
      max-width: 320px; 
      overflow-y: auto; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .leaflet-popup-content h3 { margin: 0 0 10px 0; color: #0f172a; font-size: 15px; border-bottom: 2px solid #16a34a; }

    .custom-tooltip {
      background: rgba(15, 23, 42, 0.95) !important;
      border: 1px solid #38bdf8 !important;
      color: #ffffff !important;
      border-radius: 6px !important;
      padding: 6px 10px !important;
      box-shadow: 0 6px 16px rgba(0,0,0,0.5) !important;
      backdrop-filter: blur(4px);
    }
    .custom-tooltip-title { font-weight: bold; font-size: 12px; color: #ffffff; }
    .custom-tooltip-sub { font-size: 10px; color: #38bdf8; }

    @media (max-width: 600px) {
      #side-panel { top: 10px; right: 10px; left: 10px; width: auto; }
      #status-msg { top: auto; bottom: 15px; left: 10px; }
      .btn-group-logs { width: 100%; justify-content: flex-end; }
    }
  </style>
</head>
<body>

  <!-- Validación y Control de Sesión Global -->
  <script>
    const currentSession = JSON.parse(sessionStorage.getItem('current_session') || 'null');
    const revokedSessions = JSON.parse(localStorage.getItem('sig_revoked_sessions') || '[]');

    if (!currentSession || (currentSession.sessionId && revokedSessions.includes(currentSession.sessionId))) {
      sessionStorage.removeItem('current_session');
      window.location.href = 'login.html';
    }

    // Monitoreo en tiempo real de revocación de sesión
    setInterval(() => {
      const revoked = JSON.parse(localStorage.getItem('sig_revoked_sessions') || '[]');
      if (currentSession && currentSession.sessionId && revoked.includes(currentSession.sessionId)) {
        sessionStorage.removeItem('current_session');
        window.location.href = 'login.html';
      }
    }, 3000);
  </script>

  <div id="status-msg">Iniciando mapa...</div>

  <button id="floating-search-btn" onclick="openPanel()">🔍 Buscar</button>

  <div id="side-panel">
    <div class="panel-header-bar">
      <span>FILTROS Y BÚSQUEDA</span>
      <button class="btn-close-panel" onclick="closePanel()">✖</button>
    </div>

    <label for="select-depto">Departamento</label>
    <select id="select-depto">
      <option value="todos">Todos los Departamentos</option>
    </select>

    <label for="select-muni">Municipio</label>
    <select id="select-muni">
      <option value="todos">Todos los Municipios</option>
    </select>

    <label for="search-input">Buscar Productor</label>
    <div class="search-row">
      <input type="text" id="search-input" placeholder="Escribe un nombre..." />
      <button class="btn-clear-search" onclick="fullReset()" title="Limpiar y Regresar a la Vista General">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C8 2 5 7 5 13C5 17.5 8 21 12 21C16 21 19 17.5 19 13C19 7 16 2 12 2Z" fill="#15803d" stroke="#86efac" stroke-width="1.5"/>
          <path d="M12 5C9.5 5 7 8.5 7 13.5C7 16.8 9.2 19 12 19C14.8 19 17 16.8 17 13.5C17 8.5 14.5 5 12 5Z" fill="#facc15"/>
          <circle cx="12" cy="14" r="2.8" fill="#78350f" stroke="#451a03" stroke-width="1"/>
        </svg>
      </button>
    </div>

    <div class="list-header">
      <span>PRODUCTORES</span>
      <span id="count-producers">0</span>
    </div>

    <div id="producer-list-container">
      <ul id="producer-list"></ul>
      <div id="empty-prompt" class="empty-prompt">Selecciona un filtro para desplegar el listado.</div>
    </div>

    <div class="admin-bar">
      <button id="btn-logs" class="btn-admin btn-users" onclick="openAdminModal()" style="display:none;">Usuarios / Bitácora</button>
      <button class="btn-admin btn-logout" onclick="logout()">Cerrar Sesión</button>
    </div>
  </div>

  <div id="map"></div>

  <!-- Modal Administración -->
  <div id="admin-modal">
    <div class="modal-content">
      <button class="btn-close-modal" onclick="closeAdminModal()">Cerrar</button>
      
      <div class="modal-header-container" style="margin-top:0;">
        <h3>Crear Nuevo Usuario</h3>
      </div>
      <form class="form-create-user" onsubmit="addUser(event)">
        <input type="text" id="new-name" placeholder="Nombre completo" required>
        <input type="text" id="new-user" placeholder="Usuario" required>
        <input type="password" id="new-pass" placeholder="Contraseña" required>
        <select id="new-role">
          <option value="invitado">Invitado</option>
          <option value="admin">Administrador</option>
        </select>
        <button type="submit" class="btn-add-user">+ Registrar Usuario</button>
      </form>

      <div class="modal-header-container">
        <h3>Usuarios Registrados</h3>
      </div>
      <table class="modal-table">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Usuario</th>
            <th>Contraseña</th>
            <th>Rol</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="users-table-body"></tbody>
      </table>

      <!-- Bitácora Unificada -->
      <div class="modal-header-container">
        <h3>Bitácora Unificada de Accesos y Sesiones</h3>
        <div class="btn-group-logs">
          <button class="btn-download-logs" onclick="downloadLogsTXT()" title="Descargar todo el historial registrado en TXT">📥 Descargar Historial (.txt)</button>
          <button class="btn-clear-logs" onclick="clearLogsScreen()" title="Limpiar la pantalla de la bitácora visible">🧹 Limpiar Registros</button>
        </div>
      </div>
      <table class="modal-table">
        <thead>
          <tr>
            <th>Usuario</th>
            <th>Fecha y Hora</th>
            <th>Resultado</th>
            <th>Duración</th>
          </tr>
        </thead>
        <tbody id="unified-logs-table-body"></tbody>
      </table>
    </div>
  </div>

  <!-- Librerías Leaflet y Conversor KML -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@tmcw/togeojson@5.8.1/dist/togeojson.umd.js"></script>

  <script>
    // Soporte para reconocer a cualquier Administrador (ej: admin, keiberth, etc.)
    if (currentSession && currentSession.role && String(currentSession.role).toLowerCase() === 'admin') {
      document.getElementById('btn-logs').style.display = 'block';
    }

    var statusDiv = document.getElementById('status-msg');
    var selectDepto = document.getElementById('select-depto');
    var selectMuni = document.getElementById('select-muni');
    var searchInput = document.getElementById('search-input');
    var producerList = document.getElementById('producer-list');
    var emptyPrompt = document.getElementById('empty-prompt');
    var countProducers = document.getElementById('count-producers');
    var sidePanel = document.getElementById('side-panel');

    function closePanel() { sidePanel.classList.add('hidden'); }
    function openPanel() { sidePanel.classList.remove('hidden'); }

    // Inicialización del Mapa
    var map = L.map('map', { maxZoom: 20, zoomControl: false }).setView([14.6, -87.8], 3);
    L.control.zoom({ position: 'bottomleft' }).addTo(map);

    L.tileLayer('https://mt1.google.com/vt/lyrs=y,p&x={x}&y={y}&z={z}', {
      maxZoom: 20, 
      attribution: '© Google Earth Terrain'
    }).addTo(map);

    var googleEarthPin = L.divIcon({
      className: 'google-earth-marker',
      html: `
        <svg width="28" height="40" viewBox="0 0 28 40" fill="none" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.6));">
          <path d="M14 0C6.26801 0 0 6.26801 0 14C0 24.5 14 40 14 40C14 40 28 24.5 28 14C28 6.26801 21.732 0 14 0Z" fill="#FDE047" stroke="#A16207" stroke-width="1.2"/>
          <circle cx="14" cy="13.5" r="7" fill="#FFFFFF" stroke="#CA8A04" stroke-width="0.8"/>
          <path d="M14 8L15.3 11.2 L18.8 11.4 L16.1 13.6 L17 17 L14 15.1 L11 17 L11.9 13.6 L9.2 11.4 L12.7 11.2 Z" fill="#000000"/>
        </svg>
      `,
      iconSize: [28, 40], iconAnchor: [14, 40], popupAnchor: [0, -36]
    });

    function autolink(text) {
      if (!text) return "";
      var str = typeof text === 'string' ? text : String(text);
      if (typeof text === 'object' && text.value) str = String(text.value);
      var exp = /(\b(https?|ftp|file):\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])/ig;
      return str.replace(exp, "<a href='$1' target='_blank'>Enlace KoboToolbox</a>");
    }

    function cleanDescriptionText(desc) {
      if (!desc) return "";
      var str = typeof desc === 'string' ? desc : (desc.value || "");
      str = str.replace(/GPS_altitude:\s*([\d.]+)/gi, function(match, p1) {
        return "GPS_altitude: " + Math.round(parseFloat(p1)) + " msnm";
      });
      return autolink(str);
    }

    var rawGeoJSON = null, kmlLayer = null, locationData = {}, featureMarkersMap = new Map();

    function getProp(props, key) {
      if (!props) return "";
      var foundKey = Object.keys(props).find(k => k.toLowerCase() === key.toLowerCase());
      return foundKey ? props[foundKey] : "";
    }

    function extractField(feature, fieldName) {
      var props = feature.properties || {};
      var val = getProp(props, fieldName);
      if (val) return String(val).trim();
      var desc = props.description || "";
      var strDesc = typeof desc === 'string' ? desc : (desc.value || "");
      if (strDesc) {
        var regex = new RegExp(fieldName + "[^<]*</td>\\s*<td[^>]*>(.*?)</td>", "i");
        var match = strDesc.match(regex);
        if (match && match[1]) return match[1].replace(/<[^>]+>/g, '').trim();
      }
      return "";
    }

    function fullReset() {
      searchInput.value = '';
      selectDepto.value = 'todos';
      updateMuniDropdown('todos');
      map.closePopup();
      renderMapFeatures();
      map.flyTo([14.6, -87.8], 8, { duration: 2.2, easeLinearity: 0.25 });
    }

    statusDiv.innerText = "Cargando datos del KML...";
    fetch('./honduras.kml', { cache: 'no-cache' })
      .then(r => {
        if (!r.ok) throw new Error("No se pudo cargar el archivo honduras.kml");
        return r.text();
      })
      .then(kmlText => {
        var parser = new DOMParser();
        var kmlDom = parser.parseFromString(kmlText, 'text/xml');
        rawGeoJSON = toGeoJSON.kml(kmlDom);

        if (rawGeoJSON && rawGeoJSON.features) {
          rawGeoJSON.features.forEach(feature => {
            var depto = extractField(feature, "departamento") || extractField(feature, "depto") || "Sin Departamento";
            var muni = extractField(feature, "municipio") || extractField(feature, "muni") || "Sin Municipio";
            if (!locationData[depto]) locationData[depto] = new Set();
            if (muni) locationData[depto].add(muni);
          });

          Object.keys(locationData).sort().forEach(depto => {
            var opt = document.createElement('option');
            opt.value = depto; opt.textContent = depto;
            selectDepto.appendChild(opt);
          });

          renderMapFeatures();
        }
        
        statusDiv.style.opacity = '0';
        setTimeout(() => statusDiv.style.display = 'none', 500);

        setTimeout(() => {
          map.flyTo([14.6, -87.8], 8, { duration: 3.2, easeLinearity: 0.2 });
        }, 300);
      })
      .catch(err => {
        console.error(err);
        statusDiv.innerText = "Error cargando archivo KML";
        statusDiv.style.color = "#ef4444";
      });

    // CORRECCIÓN DEFINITIVA DE POSICIONAMIENTO EN PUNTO GPS
    function selectAndFocusProducer(feat, marker) {
      var props = feat.properties || {};
      var nombre = props.name || "Productor sin nombre";
      var depto = extractField(feat, "departamento") || extractField(feat, "depto") || "";
      var muni = extractField(feat, "municipio") || extractField(feat, "muni") || "";

      searchInput.value = nombre;
      if (depto && selectDepto.value !== depto) {
        selectDepto.value = depto;
        updateMuniDropdown(depto);
      }
      if (muni) selectMuni.value = muni;

      if (window.innerWidth <= 600) closePanel();

      var targetMarker = marker || featureMarkersMap.get(feat);
      if (targetMarker) {
        var latLng = targetMarker.getLatLng();
        
        // Centrado exacto deshabilitando autopan automático
        map.flyTo(latLng, 16, { 
          duration: 1.5,
          easeLinearity: 0.25 
        });
        
        targetMarker.openPopup({ autoPan: false });
        targetMarker.openTooltip();
      }
    }

    function renderMapFeatures() {
      if (!rawGeoJSON) return;

      var selectedDepto = selectDepto.value, selectedMuni = selectMuni.value, searchText = searchInput.value.toLowerCase().trim();

      if (kmlLayer) map.removeLayer(kmlLayer);
      producerList.innerHTML = ''; featureMarkersMap.clear();

      var visibleFeatures = [];

      kmlLayer = L.geoJSON(rawGeoJSON, {
        filter: function(feature) {
          var nombre = (feature.properties.name || "").toLowerCase();
          var depto = extractField(feature, "departamento") || extractField(feature, "depto") || "Sin Departamento";
          var muni = extractField(feature, "municipio") || extractField(feature, "muni") || "Sin Municipio";

          var matchDepto = (selectedDepto === 'todos' || depto === selectedDepto);
          var matchMuni = (selectedMuni === 'todos' || muni === selectedMuni);
          var matchSearch = (searchText === '' || nombre.includes(searchText));

          var isMatch = matchDepto && matchMuni && matchSearch;
          if (isMatch) visibleFeatures.push(feature);
          return isMatch;
        },
        pointToLayer: (feature, latlng) => L.marker(latlng, { icon: googleEarthPin }),
        onEachFeature: function(feature, layer) {
          var nombre = feature.properties.name || "Productor sin nombre";
          var depto = extractField(feature, "departamento") || extractField(feature, "depto") || "";
          var muni = extractField(feature, "municipio") || extractField(feature, "muni") || "";

          var popupContent = "<h3>" + nombre + "</h3><div>" + cleanDescriptionText(feature.properties.description) + "</div>";
          layer.bindPopup(popupContent, { autoPan: false });

          var tooltipContent = `
            <div class="custom-tooltip-title">${nombre}</div>
            <div class="custom-tooltip-sub">${depto}${muni ? ' • ' + muni : ''}</div>
          `;
          layer.bindTooltip(tooltipContent, { permanent: false, direction: 'top', className: 'custom-tooltip' });

          layer.on('click', () => selectAndFocusProducer(feature, layer));
          featureMarkersMap.set(feature, layer);
        }
      }).addTo(map);

      visibleFeatures.sort((a, b) => (a.properties.name || "").localeCompare(b.properties.name || ""));
      countProducers.innerText = visibleFeatures.length;

      var hasActiveFilter = (selectedDepto !== 'todos' || selectedMuni !== 'todos' || searchText !== '');

      if (hasActiveFilter) {
        emptyPrompt.style.display = 'none'; producerList.style.display = 'flex';
        visibleFeatures.forEach(feat => {
          var nombre = feat.properties.name || "Productor sin nombre";
          var depto = extractField(feat, "departamento") || extractField(feat, "depto") || "";
          var muni = extractField(feat, "municipio") || extractField(feat, "muni") || "";

          var li = document.createElement('li');
          li.innerHTML = `<span class="p-name">${nombre}</span><span class="p-location">${depto}${muni ? ' • ' + muni : ''}</span>`;
          li.addEventListener('click', () => selectAndFocusProducer(feat, featureMarkersMap.get(feat)));
          producerList.appendChild(li);
        });

        if (kmlLayer.getBounds().isValid() && (selectedDepto !== 'todos' || selectedMuni !== 'todos')) {
          map.flyToBounds(kmlLayer.getBounds(), { padding: [60, 60], maxZoom: 13, duration: 1.8 });
        }
      } else {
        emptyPrompt.style.display = 'block'; producerList.style.display = 'none';
      }
    }

    function updateMuniDropdown(depto) {
      selectMuni.innerHTML = '<option value="todos">Todos los Municipios</option>';
      if (depto !== 'todos' && locationData[depto]) {
        Array.from(locationData[depto]).sort().forEach(muni => {
          var opt = document.createElement('option');
          opt.value = muni; opt.textContent = muni; selectMuni.appendChild(opt);
        });
      }
    }

    selectDepto.addEventListener('change', function() { 
      updateMuniDropdown(this.value); 
      selectMuni.value = 'todos';
      searchInput.value = '';
      map.closePopup();
      renderMapFeatures(); 
    });

    selectMuni.addEventListener('change', function() {
      searchInput.value = '';
      map.closePopup();
      renderMapFeatures();
    });
    
    searchInput.addEventListener('input', function() {
      if (this.value.trim() === '') {
        selectDepto.value = 'todos'; updateMuniDropdown('todos');
      }
      renderMapFeatures();
    });

    // CIERRE DEFINITIVO Y GLOBAL DE SESIÓN
    function logout() {
      if (currentSession) {
        const loginTime = new Date(currentSession.loginTime);
        const now = new Date();
        const durationMinutes = Math.max(1, Math.round((now - loginTime) / 60000));

        const newLogEntry = {
          sessionId: currentSession.sessionId || null,
          user: currentSession.user,
          login: currentSession.loginFormatted,
          duration: durationMinutes + ' min'
        };

        const logs = JSON.parse(localStorage.getItem('sig_logs') || '[]');
        logs.push(newLogEntry);
        localStorage.setItem('sig_logs', JSON.stringify(logs));

        if (currentSession.sessionId) {
          const revoked = JSON.parse(localStorage.getItem('sig_revoked_sessions') || '[]');
          if (!revoked.includes(currentSession.sessionId)) {
            revoked.push(currentSession.sessionId);
            localStorage.setItem('sig_revoked_sessions', JSON.stringify(revoked));
          }
        }
      }

      sessionStorage.removeItem('current_session');
      window.location.href = 'login.html';
    }

    function openAdminModal() {
      loadUsersTable();
      loadUnifiedLogsTable();
      document.getElementById('admin-modal').style.display = 'flex';
    }

    function closeAdminModal() {
      document.getElementById('admin-modal').style.display = 'none';
    }

    function loadUsersTable() {
      const users = JSON.parse(localStorage.getItem('sig_users') || '[]');
      const tbody = document.getElementById('users-table-body');
      tbody.innerHTML = '';
      users.forEach((u, index) => {
        const tr = document.createElement('tr');
        const isMainAdmin = u.user.toLowerCase() === 'admin';
        const passVal = u.pass || '***';
        
        tr.innerHTML = `
          <td>${u.name}</td>
          <td>${u.user}</td>
          <td>
            <span id="pass-text-${index}">••••••••</span>
            <button type="button" class="btn-toggle-pass" onclick="togglePassVisibility(${index}, '${passVal}')" title="Mostrar/Ocultar Contraseña">👁️</button>
          </td>
          <td><strong style="color:${u.role === 'admin' ? '#38bdf8' : '#cbd5e1'}">${u.role}</strong></td>
          <td>
            ${isMainAdmin ? '<span style="color:#64748b; font-size:10px;">Protegido</span>' : `<button class="btn-delete-user" onclick="deleteUser('${u.user}')">🗑️ Eliminar</button>`}
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function togglePassVisibility(index, realPass) {
      const elem = document.getElementById(`pass-text-${index}`);
      if (elem.innerText === '••••••••') {
        elem.innerText = realPass;
        elem.style.color = '#38bdf8';
        elem.style.fontFamily = 'monospace';
      } else {
        elem.innerText = '••••••••';
        elem.style.color = '#fff';
        elem.style.fontFamily = 'inherit';
      }
    }

    // CARGA DE BITÁCORA UNIFICADA SIN ERRORES DE ESTADO
    function loadUnifiedLogsTable() {
      const accessLogs = JSON.parse(localStorage.getItem('sig_access_logs') || '[]');
      const logs = JSON.parse(localStorage.getItem('sig_logs') || '[]');
      const tbody = document.getElementById('unified-logs-table-body');
      tbody.innerHTML = '';

      if (accessLogs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#64748b; font-style:italic;">No hay actividad registrada en la bitácora.</td></tr>';
        return;
      }

      const durationMap = {};
      logs.forEach(l => {
        if (l.sessionId) {
          durationMap[l.sessionId] = l.duration;
        } else if (l.user && l.login) {
          durationMap[`${l.user.toLowerCase()}_${l.login}`] = l.duration;
        }
      });

      accessLogs.slice().reverse().forEach((log) => {
        const tr = document.createElement('tr');
        const isExitoso = log.estado === 'Exitoso';
        const badgeClass = isExitoso ? 'badge-exitoso' : 'badge-fallido';
        const statusText = isExitoso ? '✓ Exitoso' : '✕ Fallido';

        let durationText = '-';
        if (isExitoso) {
          const userKey = log.usuario ? log.usuario.toLowerCase() : '';
          const compositeKey = `${userKey}_${log.fechaHora}`;

          if (log.sessionId && durationMap[log.sessionId]) {
            durationText = durationMap[log.sessionId];
          } else if (durationMap[compositeKey]) {
            durationText = durationMap[compositeKey];
          } else if (currentSession && (currentSession.sessionId === log.sessionId || (currentSession.user && currentSession.user.toLowerCase() === userKey && currentSession.loginFormatted === log.fechaHora))) {
            durationText = 'En curso / Activa';
          } else {
            durationText = 'Finalizada';
          }
        }

        tr.innerHTML = `
          <td><strong>${log.usuario}</strong></td>
          <td>${log.fechaHora}</td>
          <td><span class="badge-status ${badgeClass}">${statusText}</span></td>
          <td style="color:${durationText === 'En curso / Activa' ? '#38bdf8' : '#94a3b8'}">${durationText}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function clearLogsScreen() {
      if (confirm('¿Deseas ocultar/limpiar los registros de la pantalla actual? (El historial completo permanece resguardado para descarga).')) {
        localStorage.setItem('sig_logs', JSON.stringify([]));
        localStorage.setItem('sig_access_logs', JSON.stringify([]));
        loadUnifiedLogsTable();
      }
    }

    function downloadLogsTXT() {
      const accessLogs = JSON.parse(localStorage.getItem('sig_access_logs') || '[]');
      const logs = JSON.parse(localStorage.getItem('sig_logs') || '[]');
      
      if (accessLogs.length === 0) {
        alert('No existen registros almacenados en la bitácora actualmente.');
        return;
      }

      const durationMap = {};
      logs.forEach(l => {
        if (l.sessionId) {
          durationMap[l.sessionId] = l.duration;
        } else if (l.user && l.login) {
          durationMap[`${l.user.toLowerCase()}_${l.login}`] = l.duration;
        }
      });

      let content = "=========================================================================================\n";
      content += "               BITÁCORA UNIFICADA DE ACCESOS Y SESIONES - SIG AGUACATE                  \n";
      content += "=========================================================================================\n";
      content += "Fecha de Reporte: " + new Date().toLocaleString('es-HN') + "\n\n";

      content += String("USUARIO").padEnd(20) + String("FECHA Y HORA").padEnd(28) + String("RESULTADO").padEnd(15) + "DURACIÓN SESIÓN\n";
      content += "-----------------------------------------------------------------------------------------\n";

      accessLogs.forEach(item => {
        const isExitoso = item.estado === 'Exitoso';
        let duration = "-";
        if (isExitoso) {
          const userKey = item.usuario ? item.usuario.toLowerCase() : '';
          const compositeKey = `${userKey}_${item.fechaHora}`;
          
          if (item.sessionId && durationMap[item.sessionId]) {
            duration = durationMap[item.sessionId];
          } else if (durationMap[compositeKey]) {
            duration = durationMap[compositeKey];
          } else if (currentSession && (currentSession.sessionId === item.sessionId || (currentSession.user && currentSession.user.toLowerCase() === userKey && currentSession.loginFormatted === item.fechaHora))) {
            duration = "En curso / Activa";
          } else {
            duration = "Finalizada";
          }
        }

        content += String(item.usuario).padEnd(20) + 
                   String(item.fechaHora).padEnd(28) + 
                   String(item.estado).padEnd(15) + 
                   duration + "\n";
      });

      content += "-----------------------------------------------------------------------------------------\n";
      content += "Total de registros procesados: " + accessLogs.length + "\n";

      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `bitacora_unificada_sig_${new Date().toISOString().slice(0,10)}.txt`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    function addUser(e) {
      e.preventDefault();
      const name = document.getElementById('new-name').value.trim();
      const user = document.getElementById('new-user').value.trim();
      const pass = document.getElementById('new-pass').value.trim();
      const role = document.getElementById('new-role').value;

      const users = JSON.parse(localStorage.getItem('sig_users') || '[]');
      if (users.some(u => u.user.toLowerCase() === user.toLowerCase())) {
        alert('El usuario ya existe. Por favor elige otro.');
        return;
      }

      users.push({ name, user, pass, role });
      localStorage.setItem('sig_users', JSON.stringify(users));

      document.getElementById('new-name').value = '';
      document.getElementById('new-user').value = '';
      document.getElementById('new-pass').value = '';

      loadUsersTable();
      alert('Usuario registrado exitosamente');
    }

    function deleteUser(username) {
      if (confirm(`¿Estás seguro de que deseas eliminar al usuario "${username}"?`)) {
        let users = JSON.parse(localStorage.getItem('sig_users') || '[]');
        users = users.filter(u => u.user.toLowerCase() !== username.toLowerCase());
        localStorage.setItem('sig_users', JSON.stringify(users));
        loadUsersTable();
      }
    }
  </script>
