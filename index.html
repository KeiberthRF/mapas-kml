<!DOCTYPE html>
<html lang="es">
<head>
  <title>Mapa Productores de Aguacate de Honduras</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Estilos de Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { 
      margin: 0; 
      padding: 0; 
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
      background-color: #0f172a; 
      overflow: hidden;
    }
    #map { height: 100vh; width: 100vw; z-index: 1; }

    #status-msg {
      position: absolute;
      top: 10px;
      left: 50px;
      z-index: 1000;
      background: #0f172a;
      color: #38bdf8;
      padding: 8px 15px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      border: 1px solid #1e293b;
      transition: opacity 0.5s ease;
    }

    #floating-search-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1090;
      background: #0284c7;
      color: #fff;
      border: 1px solid #38bdf8;
      padding: 10px 14px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: bold;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    #floating-search-btn:hover { background: #0369a1; transform: scale(1.05); }

    #side-panel {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1100;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(10px);
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #334155;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 290px;
      max-height: calc(100vh - 30px);
      box-sizing: border-box;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #side-panel.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateX(120%);
    }

    .panel-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 6px;
    }

    .panel-header-bar span {
      font-size: 11px;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 0.5px;
    }

    .btn-close-panel {
      background: #334155;
      color: #94a3b8;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-close-panel:hover { background: #ef4444; color: #fff; }
