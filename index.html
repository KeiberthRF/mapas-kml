<!DOCTYPE html>
<html>
<head>
  <title>Mapa Productores de Aguacate de Honduras</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
    #map { height: 100vh; width: 100vw; }

    /* Ficha emergente blanca al hacer clic (Igual a Google Earth) */
    .leaflet-popup-content-wrapper {
      border-radius: 4px;
      padding: 10px;
      max-height: 400px;
      max-width: 380px;
      overflow-y: auto;
      box-shadow: 0 3px 14px rgba(0,0,0,0.4);
    }
    .leaflet-popup-content {
      margin: 5px;
      font-size: 13px;
      line-height: 1.5;
      color: #000;
    }
    .leaflet-popup-content h3 {
      margin: 0 0 8px 0;
      color: #000;
      font-size: 15px;
      font-weight: bold;
      border-bottom: 1px solid #ccc;
      padding-bottom: 4px;
    }
    /* Enlaces activos para KoboToolbox */
    .leaflet-popup-content a {
      color: #1a73e8;
      font-weight: bold;
      word-break: break-all;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>

  <script>
    // Inicializar mapa centrado en Honduras
    var map = L.map('map', {
      zoomControl: true
    }).setView([14.6, -87.8], 8);

    // Única capa permitida: Google Satélite + Etiquetas HD
    L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: '© Google Earth'
    }).addTo(map);

    // Ícono amarillo con estrella oficial de Google Earth
    var iconoEstrellaAmarilla = L.icon({
      iconUrl: 'https://maps.google.com/mapfiles/kml/paddle/ylw-stars.png',
      iconSize: [32, 32],
      iconAnchor: [16, 32],
      popupAnchor: [0, -32]
    });

    // Función para convertir URLs de KoboToolbox en enlaces clicables
    function convertirEnlaces(texto) {
      if (!texto) return "";
      var regex = /(\b(https?|ftp):\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])/ig;
      return texto.replace(regex, "<a href='$1' target='_blank'>$1</a>");
    }

    // Configurar el procesamiento del KML
    var capaCustom = L.geoJson(null, {
      pointToLayer: function (feature, latlng) {
        return L.marker(latlng, { icon: iconoEstrellaAmarilla });
      },
      onEachFeature: function (feature, layer) {
        var props = feature.properties || {};
        var nombre = props.name || "Productor";
        var descripcion = props.description || "";

        var contenidoPopup = "<h3>" + nombre + "</h3>";
        if (descripcion) {
          contenidoPopup += "<div>" + convertirEnlaces(descripcion) + "</div>";
        }

        layer.bindPopup(contenidoPopup);
        layer.bindTooltip(nombre, { permanent: false, direction: 'top' });
      }
    });

    // Cargar el archivo KML desde tu repositorio de GitHub
    var kmlLayer = omnivore.kml('honduras.kml.kml', null, capaCustom)
      .on('ready', function() {
        map.fitBounds(kmlLayer.getBounds());
      })
      .addTo(map);
  </script>
</body>
</html>
