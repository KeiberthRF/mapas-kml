<!DOCTYPE html>
<html>
<head>
  <title>Mapa Productores de Aguacate de Honduras</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
    #map { height: 100vh; width: 100vw; }

    /* Estilo de la ventana informativa de Google Earth */
    .leaflet-popup-content-wrapper {
      border-radius: 6px;
      padding: 8px;
      max-height: 380px;
      max-width: 360px;
      overflow-y: auto;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    .leaflet-popup-content {
      margin: 5px;
      font-size: 13px;
      line-height: 1.5;
      color: #111;
    }
    .leaflet-popup-content h3 {
      margin: 0 0 8px 0;
      color: #000;
      font-size: 15px;
      font-weight: bold;
      border-bottom: 2px solid #2e7d32;
      padding-bottom: 4px;
    }
    .leaflet-popup-content a {
      color: #1a73e8;
      font-weight: bold;
      word-break: break-all;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://api.mapbox.com/mapbox.js/plugins/leaflet-omnivore/v0.3.1/leaflet-omnivore.min.js"></script>

  <script>
    // Inicialización del mapa
    var map = L.map('map').setView([14.6, -87.8], 8);

    // Vista fija: Google Satélite + Etiquetas HD
    L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: '© Google Earth'
    }).addTo(map);

    // Marcador oficial de Google Earth (Estrella Amarilla)
    var iconoEstrella = L.icon({
      iconUrl: 'https://maps.google.com/mapfiles/kml/paddle/ylw-stars.png',
      iconSize: [32, 32],
      iconAnchor: [16, 32],
      popupAnchor: [0, -28]
    });

    // Convierte texto de enlaces KoboToolbox a links clicables
    function activarLinks(texto) {
      if (!texto) return "";
      var exp = /(\b(https?|ftp):\/\/[-A-Z0-9+&@#\/%?=_|!:,.;]*[-A-Z0-9+&@#\/%=_|])/ig;
      return texto.replace(exp, "<a href='$1' target='_blank'>Abrir Enlace KoboToolbox</a>");
    }

    // Capa para procesar los puntos
    var capaPuntos = L.geoJson(null, {
      pointToLayer: function (feature, latlng) {
        return L.marker(latlng, { icon: iconoEstrella });
      },
      onEachFeature: function (feature, layer) {
        var props = feature.properties || {};
        var nombre = props.name || "Productor";
        var descripcion = props.description || "";

        var contenidoPopup = "<h3>" + nombre + "</h3>";
        if (descripcion) {
          contenidoPopup += "<div>" + activarLinks(descripcion) + "</div>";
        }

        layer.bindPopup(contenidoPopup);
        layer.bindTooltip(nombre, { permanent: false, direction: 'top' });
      }
    });

    // Carga directa del archivo KML
    var kmlLayer = omnivore.kml('honduras.kml', null, capaPuntos)
      .on('ready', function() {
        map.fitBounds(kmlLayer.getBounds());
      })
      .addTo(map);
  </script>
</body>
</html>
