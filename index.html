<!DOCTYPE html>
<html lang="es">
<head>
  <title>Mapa Productores de Aguacate de Honduras</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
      background-color: #0f172a; 
      overflow: hidden;
    }
    #map { height: 100vh; width: 100vw; z-index: 1; }

    #status-msg {
      position: absolute; top: 10px; left: 50px; z-index: 1000;
      background: #0f172a; color: #38bdf8; padding: 8px 15px;
      border-radius: 6px; font-size: 12px; font-weight: bold; border: 1px solid #1e293b;
    }

    #floating-search-btn {
      position: absolute; top: 10px; right: 10px; z-index: 1090;
      background: #0284c7; color: #fff; border: 1px solid #38bdf8;
      padding: 10px 14px; border-radius: 50px; font-size: 14px; font-weight: bold;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6); cursor: pointer; display: flex; align-items: center; gap: 6px;
    }

    #side-panel {
      position: absolute; top: 10px; right: 10px; z-index: 1100;
      background: rgba(15, 23, 42, 0.96); backdrop-filter: blur(10px);
      padding: 14px; border-radius: 12px; border: 1px solid #334155;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6); display: flex; flex-direction: column;
      gap: 10px; width: 290px; max-height: calc(100vh - 30px); transition: all 0.3s ease;
    }

    #side-panel.hidden { opacity: 0; pointer-events: none; transform: translateX(120%); }

    .panel-header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 6px; }
    .panel-header-bar span { font-size: 11px; font-weight: 700; color: #38bdf8; }

    .btn-close-panel { background: #334155; color: #94a3b8; border: none; width: 22px; height: 22px; border-radius: 50%; font-size: 12px; cursor: pointer; }

    #side-panel label { font-size: 10px; text-transform: uppercase; font-weight: 700; color: #94a3b8; }
    #side-panel select, #search-input {
      padding: 8px 12px; border-radius: 6px; border: 1px solid #334155;
      background: #1e293b; color: #f8fafc; font-size: 13px; outline: none; width: 100%;
    }

    .search-row { display: flex; gap: 6px; align-items: center; }
    .btn-clear-search { background: #334155; border: 1px solid #475569; color: #f8fafc; padding: 8px 10px; border-radius: 6px; cursor: pointer; }

    .list-header { font-size: 11px; font-weight: bold; color: #38bdf8; border-bottom: 1px solid #334155; padding-bottom: 6px; display: flex; justify-content: space-between; }
    #producer-list-container { overflow-y: auto; max-height: 160px; }
    #producer-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
    #producer-list li { padding: 8px 10px; border-radius: 6px; cursor: pointer; background: #1e293b; border: 1px solid #334155; }

    .empty-prompt { font-size: 11px; color: #64748b; text-align: center; padding: 10px; font-style: italic; }

    /* ESTILO DEL BOTÓN DEL DASHBOARD DENTRO DEL PANEL */
    .btn-goto-dashboard {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff; border: 1px solid #34d399; padding: 10px;
      border-radius: 8px; font-size: 11px; font-weight: 800; cursor: pointer;
      text-align: center; text-decoration: none; display: flex; align-items: center;
      justify-content: center; gap: 6px; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
      transition: all 0.2s ease; margin-top: 4px;
    }
    .btn-goto-dashboard:hover { background: #059669; transform: translateY(-1px); }

    .btn-logout { background: #ef4444; color: #fff; border: none; padding: 8px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; }

    .leaflet-popup { position: fixed !important; top: 10px !important; right: 315px !important; left: auto !important; bottom: auto !important; transform: none !important; z-index: 1050 !important; }
    .leaflet-popup-tip-container { display: none !important; }
    .leaflet-popup-content-wrapper { background: rgba(15, 23, 42, 0.95) !important; border: 1px solid #38bdf8 !important; color: #f8fafc !important; border-radius: 12px !important; padding: 14px !important; width: 310px !important; }
    .leaflet-popup-content h3 { margin: 0 0 8px 0 !important; color: #38bdf8 !important; font-size: 13px !important; border-bottom: 1px solid #334155 !important; }

    .custom-tooltip { background: rgba(15, 23, 42, 0.92) !important; border: 1px solid #38bdf8 !important; color: #ffffff !important; border-radius: 6px !important; padding: 6px 10px !important; }
  </style>
</head>
<body>

  <script>
    const currentSession = JSON.parse(sessionStorage.getItem('current_session') || 'null');
    if (!currentSession) { window.location.href = 'login.html'; }
  </script>

  <div id="status-msg">Cargando mapa...</div>
  <button id="floating-search-btn" onclick="openPanel()">🔍 Buscar</button>

  <div id="side-panel">
    <div class="panel-header-bar">
      <span>FILTROS Y BÚSQUEDA</span>
      <button class="btn-close-panel" onclick="closePanel()">✖</button>
    </div>

    <label for="select-depto">Departamento</label>
    <select id="select-depto"><option value="todos">Todos los Departamentos</option></select>

    <label for="select-muni">Municipio</label>
    <select id="select-muni"><option value="todos">Todos los Municipios</option></select>

    <label for="search-input">Buscar Productor</label>
    <div class="search-row">
      <input type="text" id="search-input" placeholder="Escribe un nombre..." />
      <button class="btn-clear-search" onclick="fullReset()">🧹</button>
    </div>

    <div class="list-header">
      <span>PRODUCTORES</span>
      <span id="count-producers">0</span>
    </div>

    <div id="producer-list-container">
      <ul id="producer-list"></ul>
      <div id="empty-prompt" class="empty-prompt">Selecciona un filtro para listar.</div>
    </div>

    <!-- BOTÓN PARA ABRIR EL DASHBOARD -->
    <a href="dashboard.html" target="_blank" class="btn-goto-dashboard">
      📊 Ir a Dashboard Estadístico
    </a>

    <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@tmcw/togeojson@5.8.1/dist/togeojson.umd.js"></script>

  <script>
    var statusDiv = document.getElementById('status-msg');
    var selectDepto = document.getElementById('select-depto');
    var selectMuni = document.getElementById('select-muni');
    var searchInput = document.getElementById('search-input');
    var producerList = document.getElementById('producer-list');
    var emptyPrompt = document.getElementById('empty-prompt');
    var countProducers = document.getElementById('count-producers');
    var sidePanel = document.getElementById('side-panel');

    function closePanel() { sidePanel.classList.add('hidden'); }
    function openPanel() { sidePanel.classList.remove('hidden'); }

    var map = L.map('map', { maxZoom: 20 }).setView([14.6, -87.8], 8);

    L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 20 }).addTo(map);

    var googleEarthPin = L.divIcon({
      className: 'google-earth-marker',
      html: `<svg width="28" height="40" viewBox="0 0 28 40"><path d="M14 0C6.26801 0 0 6.26801 0 14C0 24.5 14 40 14 40C14 40 28 24.5 28 14C28 6.26801 21.732 0 14 0Z" fill="#FDE047"/><circle cx="14" cy="13.5" r="7" fill="#FFFFFF"/></svg>`,
      iconSize: [28, 40], iconAnchor: [14, 40], popupAnchor: [0, -36]
    });

    var rawGeoJSON = null, kmlLayer = null, locationData = {};

    function getProp(props, key) {
      if (!props) return "";
      var foundKey = Object.keys(props).find(k => k.toLowerCase() === key.toLowerCase());
      return foundKey ? props[foundKey] : "";
    }

    function extractField(feature, fieldName) {
      var props = feature.properties || {};
      var val = getProp(props, fieldName);
      if (val) return String(val).trim();
      var desc = props.description || "";
      var strDesc = typeof desc === 'string' ? desc : (desc.value || "");
      if (strDesc) {
        var regex = new RegExp(fieldName + "[^<]*</td>\\s*<td[^>]*>(.*?)</td>", "i");
        var match = strDesc.match(regex);
        if (match && match[1]) return match[1].replace(/<[^>]+>/g, '').trim();
      }
      return "";
    }

    fetch('./honduras.kml', { cache: 'no-cache' })
      .then(r => r.text())
      .then(kmlText => {
        var parser = new DOMParser();
        rawGeoJSON = toGeoJSON.kml(parser.parseFromString(kmlText, 'text/xml'));

        rawGeoJSON.features.forEach(feature => {
          var depto = extractField(feature, "departamento") || extractField(feature, "depto") || "Sin Departamento";
          var muni = extractField(feature, "municipio") || extractField(feature, "muni") || "Sin Municipio";
          if (!locationData[depto]) locationData[depto] = new Set();
          if (muni) locationData[depto].add(muni);
        });

        Object.keys(locationData).sort().forEach(depto => {
          var opt = document.createElement('option');
          opt.value = depto; opt.textContent = depto;
          selectDepto.appendChild(opt);
        });

        renderMapFeatures();
        statusDiv.style.display = 'none';
      });

    function renderMapFeatures() {
      var selectedDepto = selectDepto.value, selectedMuni = selectMuni.value, searchText = searchInput.value.toLowerCase().trim();
      if (kmlLayer) map.removeLayer(kmlLayer);
      producerList.innerHTML = '';
      var visibleFeatures = [];

      kmlLayer = L.geoJSON(rawGeoJSON, {
        filter: function(feature) {
          var nombre = (feature.properties.name || "").toLowerCase();
          var depto = extractField(feature, "departamento") || extractField(feature, "depto") || "Sin Departamento";
          var muni = extractField(feature, "municipio") || extractField(feature, "muni") || "Sin Municipio";
          var isMatch = (selectedDepto === 'todos' || depto === selectedDepto) && (selectedMuni === 'todos' || muni === selectedMuni) && (searchText === '' || nombre.includes(searchText));
          if (isMatch) visibleFeatures.push(feature);
          return isMatch;
        },
        pointToLayer: (feature, latlng) => L.marker(latlng, { icon: googleEarthPin }),
        onEachFeature: function(feature, layer) {
          var nombre = feature.properties.name || "Productor";
          layer.bindPopup(`<h3>${nombre}</h3><div>${feature.properties.description || ''}</div>`, { autoPan: false });
          layer.bindTooltip(nombre, { className: 'custom-tooltip' });
        }
      }).addTo(map);

      countProducers.innerText = visibleFeatures.length;
      if (selectedDepto !== 'todos' || selectedMuni !== 'todos' || searchText !== '') {
        emptyPrompt.style.display = 'none'; producerList.style.display = 'flex';
        visibleFeatures.forEach(feat => {
          var li = document.createElement('li');
          li.innerHTML = `<span>${feat.properties.name}</span>`;
          li.onclick = () => map.flyTo([feat.geometry.coordinates[1], feat.geometry.coordinates[0]], 15);
          producerList.appendChild(li);
        });
      } else {
        emptyPrompt.style.display = 'block'; producerList.style.display = 'none';
      }
    }

    function fullReset() { searchInput.value = ''; selectDepto.value = 'todos'; updateMuniDropdown('todos'); renderMapFeatures(); map.flyTo([14.6, -87.8], 8); }
    function updateMuniDropdown(depto) {
      selectMuni.innerHTML = '<option value="todos">Todos los Municipios</option>';
      if (depto !== 'todos' && locationData[depto]) {
        Array.from(locationData[depto]).sort().forEach(muni => {
          var opt = document.createElement('option'); opt.value = muni; opt.textContent = muni; selectMuni.appendChild(opt);
        });
      }
    }

    selectDepto.addEventListener('change', function() { updateMuniDropdown(this.value); renderMapFeatures(); });
    selectMuni.addEventListener('change', renderMapFeatures);
    searchInput.addEventListener('input', renderMapFeatures);

    function logout() { sessionStorage.removeItem('current_session'); window.location.href = 'login.html'; }
  </script>
</body>
</html>
