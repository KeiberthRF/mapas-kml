<!DOCTYPE html>
<html>
<head>
  <title>Mapa Productores de Aguacate de Honduras</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Estilos de Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
    #map { height: 100vh; width: 100vw; }

    /* Estilo para las fichas informativas de los productores */
    .leaflet-popup-content-wrapper {
      border-radius: 8px;
      padding: 10px;
      max-height: 400px;
      max-width: 360px;
      overflow-y: auto;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .leaflet-popup-content {
      margin: 5px;
      font-size: 13px;
      line-height: 1.5;
      color: #222;
    }
    .leaflet-popup-content h3 {
      margin: 0 0 10px 0;
      color: #1a237e;
      font-size: 15px;
      border-bottom: 2px solid #2e7d32;
      padding-bottom: 4px;
    }
    .leaflet-popup-content a {
      color: #0d47a1;
      font-weight: bold;
      word-break: break-all;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Librerías de Leaflet y Omnivore KML -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://api.mapbox.com/mapbox.js/plugins/leaflet-omnivore/v0.3.1/leaflet-omnivore.min.js"></script>

  <script>
    // Inicialización del mapa
    var map = L.map('map', {
      maxZoom: 20
    }).setView([14.6, -87.8], 8);

    // 1. Capa Satelital Google con Etiquetas (Híbrido)
    var googleHibrido = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: '© Google Earth'
    }).addTo(map);

    // 2. Capa Satelital Google Solo Imagen HD
    var googleSatelite = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: '© Google Earth'
    });

    // 3. Capa de Calles (OpenStreetMap)
    var calles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    });

    // Selector de capas arriba a la derecha
    var baseMaps = {
      "Satélite + Etiquetas HD": googleHibrido,
      "Satélite Solo HD": googleSatelite,
      "Mapa Calles": calles
    };
    L.control.layers(baseMaps).addTo(map);

    // Función para activar enlaces de texto (KoboToolbox)
    function autolink(text) {
      if (!text) return "";
      var exp = /(\b(https?|ftp|file):\/\/[-A-Z0-9+&@#\/%?=_|!:,.;]*[-A-Z0-9+&@#\/%=_|])/ig;
      return text.replace(exp, "<a href='$1' target='_blank'>Abrir Enlace KoboToolbox</a>");
    }

    // Cargar el archivo KML con la librería Omnivore
    var customLayer = L.geoJson(null, {
      onEachFeature: function(feature, layer) {
        var props = feature.properties || {};
        var nombre = props.name || "Productor sin nombre";
        var descripcion = props.description || "";

        var popupContent = "<h3>" + nombre + "</h3>";
        if (descripcion) {
          popupContent += "<div>" + autolink(descripcion) + "</div>";
        }

        layer.bindPopup(popupContent);
        layer.bindTooltip(nombre, { permanent: false, direction: 'top' });
      }
    });

    // Se especifica el archivo KML cargado en tu repositorio
    var kmlLayer = omnivore.kml('honduras.kml.kml', null, customLayer)
      .on('ready', function() {
        map.fitBounds(kmlLayer.getBounds()); // Zoom automático a tus puntos
      })
      .addTo(map);
  </script>
</body>
</html>
