<!DOCTYPE html>
<html lang="es">
<head>
  <title>Acceso - SIG Productores de Aguacate de Honduras</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .login-container {
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 12px;
      border: 1px solid #334155;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      width: 320px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .login-header {
      text-align: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
      margin-bottom: 5px;
    }

    .login-header-icon {
      margin-bottom: 6px;
      display: inline-block;
    }

    .login-header h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .login-header h3 {
      margin: 3px 0 0 0;
      font-size: 12px;
      font-weight: 600;
      color: #f1f5f9;
    }

    .login-header p {
      margin: 4px 0 0 0;
      font-size: 10px;
      color: #94a3b8;
    }

    .login-container label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 700;
      color: #94a3b8;
      margin-bottom: -6px;
      display: block;
    }

    .login-container input[type="text"],
    .login-container input[type="password"] {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      font-size: 13px;
      outline: none;
      width: 100%;
      box-sizing: border-box;
    }

    .login-container input:focus {
      border-color: #38bdf8;
    }

    .btn-login {
      padding: 9px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      text-align: center;
      background: #0ea5e9;
      color: #fff;
      transition: background 0.2s;
      margin-top: 5px;
      width: 100%;
    }

    .btn-login:hover {
      background: #0284c7;
    }

    #error-msg {
      color: #ef4444;
      font-size: 11px;
      text-align: center;
      display: none;
      font-weight: bold;
    }

    .footer-credits {
      text-align: center;
      font-size: 10px;
      color: #64748b;
      margin-top: 4px;
      border-top: 1px solid #334155;
      padding-top: 8px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <div class="login-header-icon">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C8 2 5 7 5 13C5 17.5 8 21 12 21C16 21 19 17.5 19 13C19 7 16 2 12 2Z" fill="#15803d" stroke="#86efac" stroke-width="1.5"/>
          <path d="M12 5C9.5 5 7 8.5 7 13.5C7 16.8 9.2 19 12 19C14.8 19 17 16.8 17 13.5C17 8.5 14.5 5 12 5Z" fill="#facc15"/>
          <circle cx="12" cy="14" r="2.8" fill="#78350f" stroke="#451a03" stroke-width="1"/>
        </svg>
      </div>
      <h2>SIG</h2>
      <h3>Productores de Aguacate de Honduras</h3>
      <p>Plataforma de Georreferenciación y Gestión</p>
    </div>

    <div id="error-msg">Usuario o contraseña incorrectos</div>

    <form id="login-form" onsubmit="handleLogin(event)" autocomplete="off" style="display: flex; flex-direction: column; gap: 10px;">
      <label for="username">Usuario</label>
      <input type="text" id="username" autocomplete="off" value="" autofocus required placeholder="Escribe tu usuario..." />

      <label for="password">Contraseña</label>
      <input type="password" id="password" autocomplete="off" value="" required placeholder="Escribe tu contraseña..." />

      <button type="submit" class="btn-login">Ingresar al Sistema</button>
    </form>

    <div class="footer-credits">
      Sistema de Información Geográfica © Honduras
    </div>
  </div>

  <script>
    // Inicialización de Usuarios por defecto si no existen
    function initDatabase() {
      const existingUsers = localStorage.getItem('sig_users');
      if (!existingUsers) {
        const defaultUsers = [
          { name: 'Administrador Principal', user: 'admin', pass: 'admin123', role: 'admin' },
          { name: 'Usuario Invitado', user: 'invitado', pass: '123456', role: 'invitado' }
        ];
        localStorage.setItem('sig_users', JSON.stringify(defaultUsers));
      }
    }

    // Campos vacíos y cursor listo en 'Usuario'
    window.onload = function() {
      initDatabase();
      const userField = document.getElementById('username');
      const passField = document.getElementById('password');
      
      userField.value = '';
      passField.value = '';
      userField.focus();
    };

    // Validación e Inicio de Sesión
    function handleLogin(e) {
      e.preventDefault();
      
      const userInput = document.getElementById('username').value.trim();
      const passInput = document.getElementById('password').value.trim();
      const errorDiv = document.getElementById('error-msg');

      const users = JSON.parse(localStorage.getItem('sig_users') || '[]');
      
      const matchedUser = users.find(u => 
        u.user.toLowerCase() === userInput.toLowerCase() && u.pass === passInput
      );

      if (matchedUser) {
        errorDiv.style.display = 'none';

        const now = new Date();
        const loginFormatted = now.toLocaleDateString('es-HN') + ' ' + now.toLocaleTimeString('es-HN', { hour: '2-digit', minute: '2-digit' });

        const sessionData = {
          user: matchedUser.user,
          name: matchedUser.name,
          role: matchedUser.role,
          loginTime: now.getTime(),
          loginFormatted: loginFormatted
        };

        sessionStorage.setItem('current_session', JSON.stringify(sessionData));
        window.location.href = 'index.html';
      } else {
        errorDiv.style.display = 'block';
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
    }
  </script>
</body>
</html>
