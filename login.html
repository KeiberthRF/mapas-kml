<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso - Mapa Productores de Aguacate</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #f8fafc;
    }
    .login-card {
      background: rgba(30, 41, 59, 0.95);
      border: 1px solid #334155;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 380px;
    }
    .login-card h2 {
      font-size: 20px;
      color: #38bdf8;
      margin-bottom: 8px;
      text-align: center;
    }
    .login-card p {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 24px;
      text-align: center;
    }
    .form-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 700;
      color: #cbd5e1;
    }
    .form-group input {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    .form-group input:focus { border-color: #38bdf8; }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }
    .btn-submit:hover { background: #0369a1; }
    .error-msg {
      color: #ef4444;
      font-size: 12px;
      text-align: center;
      margin-top: 12px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>Sistema SIG Aguacate</h2>
    <p>Ingresa tus credenciales para acceder al mapa</p>
    <form id="login-form">
      <div class="form-group">
        <label for="username">Usuario / Correo</label>
        <input type="text" id="username" placeholder="admin / invitado" required>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-submit">Iniciar Sesión</button>
      <div id="error-msg" class="error-msg">Usuario o contraseña incorrectos</div>
    </form>
  </div>

  <script>
    // Inicialización de Usuarios por Defecto en Almacenamiento Local
    if (!localStorage.getItem('sig_users')) {
      const defaultUsers = [
        { user: 'admin', pass: 'admin123', role: 'admin', name: 'Administrador Principal' },
        { user: 'invitado', pass: 'invitado123', role: 'invitado', name: 'Usuario Invitado' }
      ];
      localStorage.setItem('sig_users', JSON.stringify(defaultUsers));
    }

    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      const users = JSON.parse(localStorage.getItem('sig_users') || '[]');

      const foundUser = users.find(x => x.user === u && x.pass === p);

      if (foundUser) {
        // Registrar sesión de inicio
        const sessionData = {
          user: foundUser.user,
          name: foundUser.name,
          role: foundUser.role,
          loginTime: new Date().toISOString(),
          loginFormatted: new Date().toLocaleString()
        };
        sessionStorage.setItem('current_session', JSON.stringify(sessionData));
        window.location.href = 'index.html';
      } else {
        document.getElementById('error-msg').style.display = 'block';
      }
    });
  </script>
</body>
</html>
