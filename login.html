<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema SIG - Productores de Aguacate de Honduras</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0f172a;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #f8fafc;
      position: relative;
      overflow: hidden;
    }

    /* Fondo con silueta vectorial de líneas estilizadas */
    .bg-shield {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 550px;
      height: 550px;
      opacity: 0.12;
      pointer-events: none;
      z-index: 0;
    }

    .login-card {
      position: relative;
      z-index: 10;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 35px 30px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .login-card h1 {
      font-size: 24px;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 1px;
      margin-bottom: 2px;
      text-transform: uppercase;
    }

    .login-card h2 {
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 22px;
      letter-spacing: 0.5px;
    }

    .form-group {
      margin-bottom: 16px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 700;
      color: #94a3b8;
    }

    .form-group input {
      padding: 11px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: rgba(30, 41, 59, 0.8);
      color: #fff;
      font-size: 13px;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-group input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.3);
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
      transition: all 0.2s ease;
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
      transform: translateY(-1px);
    }

    .error-msg {
      color: #ef4444;
      font-size: 12px;
      margin-top: 14px;
      display: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Escudo Nacional en líneas estilizadas -->
  <svg class="bg-shield" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M100 15 C50 15 20 50 20 100 C20 150 50 185 100 185 C150 185 180 150 180 100 C180 50 150 15 100 15 Z" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 2"/>
    <path d="M100 30 L110 50 L132 50 L114 62 L121 82 L100 70 L79 82 L86 62 L68 50 L90 50 Z" stroke="#38bdf8" stroke-width="1.8"/>
    <path d="M40 100 Q100 160 160 100" stroke="#38bdf8" stroke-width="2"/>
    <path d="M100 80 L100 150 M70 140 L130 140" stroke="#38bdf8" stroke-width="2"/>
  </svg>

  <div class="login-card">
    <h1>Sistema SIG</h1>
    <h2>PRODUCTORES DE AGUACATE DE HONDURAS</h2>

    <form id="login-form">
      <div class="form-group">
        <label for="username">Usuario / Correo</label>
        <input type="text" id="username" placeholder="Ingrese su usuario" required autocomplete="off">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-submit">Iniciar Sesión</button>
      <div id="error-msg" class="error-msg">Usuario o contraseña incorrectos</div>
    </form>
  </div>

  <script>
    if (!localStorage.getItem('sig_users')) {
      const defaultUsers = [
        { user: 'admin', pass: 'admin123', role: 'admin', name: 'Administrador Principal' },
        { user: 'invitado', pass: 'invitado123', role: 'invitado', name: 'Usuario Invitado' }
      ];
      localStorage.setItem('sig_users', JSON.stringify(defaultUsers));
    }

    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      const users = JSON.parse(localStorage.getItem('sig_users') || '[]');

      const foundUser = users.find(x => x.user.toLowerCase() === u.toLowerCase() && x.pass === p);

      if (foundUser) {
        const sessionData = {
          user: foundUser.user,
          name: foundUser.name,
          role: foundUser.role,
          loginTime: new Date().toISOString(),
          loginFormatted: new Date().toLocaleString()
        };
        sessionStorage.setItem('current_session', JSON.stringify(sessionData));
        window.location.href = 'index.html';
      } else {
        document.getElementById('error-msg').style.display = 'block';
      }
    });
  </script>
</body>
</html>
