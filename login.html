<!DOCTYPE html>
<html lang="es">
<head>
  <title>Acceso - SISTEMA SIG</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 60%, #020617 100%);
      color: #ffffff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Círculo decorativo punteado de fondo */
    body::before {
      content: '';
      position: absolute;
      width: 450px;
      height: 450px;
      border: 2px dashed rgba(56, 189, 248, 0.25);
      border-radius: 50%;
      pointer-events: none;
    }

    .login-card {
      position: relative;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 0 35px rgba(14, 165, 233, 0.25);
      border-radius: 20px;
      padding: 35px 30px;
      width: 380px;
      max-width: 90vw;
      z-index: 10;
    }

    .login-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .login-header h2 {
      font-size: 22px;
      font-weight: 900;
      color: #38bdf8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
    }

    .login-header h3 {
      font-size: 11px;
      font-weight: 700;
      color: #e2e8f0;
      margin-top: 6px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .form-group {
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 11px;
      font-weight: 800;
      color: #93c5fd;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      background: rgba(30, 58, 138, 0.35);
      color: #ffffff;
      font-size: 13px;
      outline: none;
      transition: all 0.3s ease;
    }

    .input-wrapper input::placeholder {
      color: #64748b;
    }

    .input-wrapper input:focus {
      border-color: #38bdf8;
      background: rgba(30, 58, 138, 0.55);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
    }

    .btn-toggle-pass {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      color: #93c5fd;
      cursor: pointer;
      font-size: 14px;
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(90deg, #06b6d4 0%, #22d3ee 100%);
      color: #0f172a;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      text-transform: capitalize;
      box-shadow: 0 0 20px rgba(34, 211, 238, 0.4);
      transition: all 0.2s ease;
      margin-top: 10px;
    }

    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 25px rgba(34, 211, 238, 0.6);
      background: linear-gradient(90deg, #22d3ee 0%, #67e8f9 100%);
    }

    #error-msg {
      color: #f87171;
      font-size: 11px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 14px;
      display: none;
      background: rgba(239, 68, 68, 0.1);
      padding: 8px;
      border-radius: 6px;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <h2>SISTEMA SIG</h2>
      <h3>PRODUCTORES DE AGUACATE DE HONDURAS</h3>
    </div>

    <div id="error-msg">Usuario o contraseña incorrectos</div>

    <form id="login-form" onsubmit="handleLogin(event)" autocomplete="off">
      <div class="form-group">
        <label for="username">USUARIO O NOMBRE</label>
        <div class="input-wrapper">
          <input type="text" id="username" autocomplete="off" value="" autofocus required placeholder="Ej: carlos, fvt, admin o invitado" />
        </div>
      </div>

      <div class="form-group">
        <label for="password">CONTRASEÑA</label>
        <div class="input-wrapper">
          <input type="password" id="password" autocomplete="off" value="" required placeholder="••••••••" />
          <button type="button" class="btn-toggle-pass" onclick="togglePasswordVisibility()" title="Mostrar/Ocultar Contraseña">👁️</button>
        </div>
      </div>

      <button type="submit" class="btn-submit">Iniciar Sesión</button>
    </form>
  </div>

  <script>
    // Inicialización de Usuarios por defecto
    function initDatabase() {
      const existingUsers = localStorage.getItem('sig_users');
      if (!existingUsers) {
        const defaultUsers = [
          { name: 'Administrador Principal', user: 'admin', pass: 'admin123', role: 'admin' },
          { name: 'Usuario Invitado', user: 'invitado', pass: '123456', role: 'invitado' }
        ];
        localStorage.setItem('sig_users', JSON.stringify(defaultUsers));
      }
    }

    // Al cargar la página: asegura campos vacíos y ubica el cursor en 'Usuario'
    window.onload = function() {
      initDatabase();
      const userField = document.getElementById('username');
      const passField = document.getElementById('password');
      
      userField.value = '';
      passField.value = '';
      userField.focus();
    };

    // Alternar visibilidad de contraseña (ojito)
    function togglePasswordVisibility() {
      const passInput = document.getElementById('password');
      if (passInput.type === 'password') {
        passInput.type = 'text';
      } else {
        passInput.type = 'password';
      }
    }

    // Validación e Inicio de Sesión
    function handleLogin(e) {
      e.preventDefault();
      
      const userInput = document.getElementById('username').value.trim();
      const passInput = document.getElementById('password').value.trim();
      const errorDiv = document.getElementById('error-msg');

      const users = JSON.parse(localStorage.getItem('sig_users') || '[]');
      
      const matchedUser = users.find(u => 
        u.user.toLowerCase() === userInput.toLowerCase() && u.pass === passInput
      );

      if (matchedUser) {
        errorDiv.style.display = 'none';

        const now = new Date();
        const loginFormatted = now.toLocaleDateString('es-HN') + ' ' + now.toLocaleTimeString('es-HN', { hour: '2-digit', minute: '2-digit' });

        const sessionData = {
          user: matchedUser.user,
          name: matchedUser.name,
          role: matchedUser.role,
          loginTime: now.getTime(),
          loginFormatted: loginFormatted
        };

        sessionStorage.setItem('current_session', JSON.stringify(sessionData));
        window.location.href = 'index.html';
      } else {
        errorDiv.style.display = 'block';
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
    }
  </script>
</body>
</html>
