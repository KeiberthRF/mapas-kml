<!DOCTYPE html>
<html lang="es">
<head>
  <title>Acceso - SISTEMA SIG</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 50% 30%, #1e293b 0%, #0f172a 60%, #020617 100%);
      color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative;
    }
    .login-container {
      position: relative; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.3); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      border-radius: 20px; padding: 40px 36px; width: 420px; max-width: 92vw; display: flex; flex-direction: column; gap: 16px; z-index: 10;
    }
    .login-header { text-align: center; border-bottom: 1px solid rgba(51, 65, 85, 0.8); padding-bottom: 16px; margin-bottom: 4px; }
    .login-header h2 { margin: 0; font-size: 20px; font-weight: 900; color: #38bdf8; letter-spacing: 1.2px; text-transform: uppercase; }
    .login-header h3 { margin: 5px 0 0 0; font-size: 12px; font-weight: 700; color: #e2e8f0; text-transform: uppercase; }
    .login-container label { font-size: 11px; text-transform: uppercase; font-weight: 800; color: #38bdf8; margin-bottom: -8px; display: block; }
    .input-wrapper { position: relative; display: flex; align-items: center; width: 100%; }
    .login-container input[type="text"], .login-container input[type="password"] {
      padding: 12px 14px; border-radius: 10px; border: 1px solid #334155; background: rgba(30, 41, 59, 0.9);
      color: #ffffff; font-size: 13.5px; outline: none; width: 100%; box-sizing: border-box;
    }
    .btn-toggle-pass { position: absolute; right: 12px; background: transparent; border: none; color: #94a3b8; cursor: pointer; font-size: 15px; }
    .btn-login {
      padding: 12px; border-radius: 10px; font-size: 13.5px; font-weight: 800; border: none; cursor: pointer;
      background: linear-gradient(90deg, #0284c7 0%, #0ea5e9 100%); color: #ffffff; width: 100%; text-transform: uppercase; margin-top: 6px;
    }
    .btn-login:hover { background: linear-gradient(90deg, #0369a1 0%, #0284c7 100%); }
    #error-msg { color: #fca5a5; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); padding: 10px; border-radius: 8px; font-size: 11.5px; text-align: center; display: none; font-weight: bold; }
    .footer-credits { text-align: center; font-size: 10.5px; color: #64748b; margin-top: 6px; border-top: 1px solid rgba(51, 65, 85, 0.8); padding-top: 10px; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <h2>SIG</h2>
      <h3>PRODUCTORES DE AGUACATE DE HONDURAS</h3>
    </div>
    <div id="error-msg">Usuario o contraseña incorrectos</div>
    <form id="login-form" onsubmit="handleLogin(event)" autocomplete="off" style="display: flex; flex-direction: column; gap: 12px;">
      <label for="username">USUARIO O NOMBRE</label>
      <div class="input-wrapper">
        <input type="text" id="username" autocomplete="off" autofocus required placeholder="Ingrese usuario" />
      </div>
      <label for="password">CONTRASEÑA</label>
      <div class="input-wrapper">
        <input type="password" id="password" autocomplete="off" required placeholder="Ingrese contraseña" />
        <button type="button" class="btn-toggle-pass" onclick="togglePasswordVisibility()" title="Mostrar/Ocultar Contraseña">👁️</button>
      </div>
      <button type="submit" class="btn-login">Iniciar Sesión</button>
    </form>
    <div class="footer-credits">Sistema de Información Geográfica © KeiberthRF</div>
  </div>

  <script>
    const ADMIN_PASSWORD = '16218391499krf';
    const DEFAULT_USERS = [
      { name: 'Administrador Principal', user: 'admin', pass: ADMIN_PASSWORD, role: 'admin' },
      { name: 'Usuario Invitado', user: 'invitado', pass: 'aspah2026', role: 'invitado' },
      { name: 'Fernando', user: 'fernando', pass: 'fvt2026', role: 'invitado' },
      { name: 'Carlos Robleto', user: 'carlos', pass: 'fincamariajose2026', role: 'invitado' },
      { name: 'Keiberth RF', user: 'keiberth', pass: '17angeles', role: 'admin' }
    ];

    window.onload = function() {
      let users = JSON.parse(localStorage.getItem('sig_users') || '[]');
      DEFAULT_USERS.forEach(defUser => {
        if (!users.some(u => u && u.user.toLowerCase() === defUser.user.toLowerCase())) {
          users.push(defUser);
        } else if (defUser.user.toLowerCase() === 'admin') {
          const idx = users.findIndex(u => u.user.toLowerCase() === 'admin');
          users[idx].pass = ADMIN_PASSWORD;
        }
      });
      localStorage.setItem('sig_users', JSON.stringify(users));
      sessionStorage.removeItem('current_session');
      document.getElementById('username').focus();
    };

    function togglePasswordVisibility() {
      const passInput = document.getElementById('password');
      if (passInput) passInput.type = (passInput.type === 'password') ? 'text' : 'password';
    }

    function handleLogin(e) {
      e.preventDefault();
      const userInput = document.getElementById('username').value.trim().toLowerCase();
      const passInput = document.getElementById('password').value.trim();
      const errorDiv = document.getElementById('error-msg');

      let users = JSON.parse(localStorage.getItem('sig_users') || '[]');
      const matchedUser = users.find(u => u && u.user.toLowerCase() === userInput && u.pass === passInput);

      const ahora = new Date();
      const fechaHoraFormato = ahora.toLocaleDateString('es-HN') + ' ' + ahora.toLocaleTimeString('es-HN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      let accessLogs = JSON.parse(localStorage.getItem('sig_access_logs') || '[]');

      if (matchedUser) {
        // Registro de acceso Exitoso
        accessLogs.push({
          usuario: matchedUser.user,
          fechaHora: fechaHoraFormato,
          estado: 'Exitoso',
          timestamp: ahora.getTime()
        });
        localStorage.setItem('sig_access_logs', JSON.stringify(accessLogs));

        const sessionData = {
          user: matchedUser.user,
          name: matchedUser.name || matchedUser.user,
          role: matchedUser.role || 'invitado',
          loginTime: ahora.getTime(),
          loginFormatted: fechaHoraFormato
        };

        sessionStorage.setItem('current_session', JSON.stringify(sessionData));
        window.location.href = 'index.html';
      } else {
        // Registro de acceso Fallido
        accessLogs.push({
          usuario: userInput || '(Vacío)',
          fechaHora: fechaHoraFormato,
          estado: 'Fallido',
          timestamp: ahora.getTime()
        });
        localStorage.setItem('sig_access_logs', JSON.stringify(accessLogs));

        if (errorDiv) errorDiv.style.display = 'block';
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
    }
  </script>
</body>
</html>
