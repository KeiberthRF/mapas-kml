<!DOCTYPE html>
<html lang="es">
<head>
  <title>Acceso - Sistema SIG Aguacate Honduras</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-card {
      background: rgba(30, 41, 59, 0.95);
      border: 1px solid #334155;
      padding: 35px 30px;
      border-radius: 16px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
    }

    .login-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .login-header-icon {
      margin-bottom: 10px;
      display: inline-block;
    }

    .login-header h2 {
      font-size: 18px;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .login-header p {
      font-size: 12px;
      color: #94a3b8;
    }

    .form-group {
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input {
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-group input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: #0284c7;
      color: #ffffff;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      margin-top: 6px;
    }

    .btn-submit:hover {
      background: #0369a1;
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    #error-msg {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      text-align: center;
      margin-bottom: 16px;
      display: none;
    }

    .footer-credits {
      text-align: center;
      margin-top: 25px;
      font-size: 10px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <div class="login-header-icon">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C8 2 5 7 5 13C5 17.5 8 21 12 21C16 21 19 17.5 19 13C19 7 16 2 12 2Z" fill="#15803d" stroke="#86efac" stroke-width="1.5"/>
          <path d="M12 5C9.5 5 7 8.5 7 13.5C7 16.8 9.2 19 12 19C14.8 19 17 16.8 17 13.5C17 8.5 14.5 5 12 5Z" fill="#facc15"/>
          <circle cx="12" cy="14" r="2.8" fill="#78350f" stroke="#451a03" stroke-width="1"/>
        </svg>
      </div>
      <h2>SIG Aguacate Honduras</h2>
      <p>Plataforma de Georreferenciación y Gestión</p>
    </div>

    <div id="error-msg">Usuario o contraseña incorrectos.</div>

    <form id="login-form" onsubmit="handleLogin(event)" autocomplete="off">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" autocomplete="off" value="" autofocus required placeholder="Ingrese su usuario">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" autocomplete="off" value="" required placeholder="Ingrese su contraseña">
      </div>

      <button type="submit" class="btn-submit">Ingresar al Sistema</button>
    </form>

    <div class="footer-credits">
      Sistema de Información Geográfica © Honduras
    </div>
  </div>

  <script>
    // Inicialización de Usuarios por Defecto si la base de datos local está vacía
    function initDatabase() {
      const existingUsers = localStorage.getItem('sig_users');
      if (!existingUsers) {
        const defaultUsers = [
          { name: 'Administrador Principal', user: 'admin', pass: 'admin123', role: 'admin' },
          { name: 'Usuario Invitado', user: 'invitado', pass: '123456', role: 'invitado' }
        ];
        localStorage.setItem('sig_users', JSON.stringify(defaultUsers));
      }
    }

    // Asegurar campos limpios y foco automático inmediato en 'Usuario'
    window.onload = function() {
      initDatabase();
      const userField = document.getElementById('username');
      const passField = document.getElementById('password');
      
      userField.value = '';
      passField.value = '';
      userField.focus();
    };

    // Procesar Inicio de Sesión
    function handleLogin(e) {
      e.preventDefault();
      
      const userInput = document.getElementById('username').value.trim();
      const passInput = document.getElementById('password').value.trim();
      const errorDiv = document.getElementById('error-msg');

      const users = JSON.parse(localStorage.getItem('sig_users') || '[]');
      
      // Buscar coincidencia de usuario y contraseña
      const matchedUser = users.find(u => 
        u.user.toLowerCase() === userInput.toLowerCase() && u.pass === passInput
      );

      if (matchedUser) {
        errorDiv.style.display = 'none';

        const now = new Date();
        const loginFormatted = now.toLocaleDateString('es-HN') + ' ' + now.toLocaleTimeString('es-HN', { hour: '2-digit', minute: '2-digit' });

        // Crear objeto de sesión activa
        const sessionData = {
          user: matchedUser.user,
          name: matchedUser.name,
          role: matchedUser.role,
          loginTime: now.getTime(),
          loginFormatted: loginFormatted
        };

        // Guardar sesión activa temporal en el navegador
        sessionStorage.setItem('current_session', JSON.stringify(sessionData));

        // Registrar entrada inmediata en el Historial Maestro Permanente
        const masterLogs = JSON.parse(localStorage.getItem('sig_master_logs') || '[]');
        masterLogs.push({
          user: matchedUser.user,
          login: loginFormatted,
          duration: 'En curso'
        });
        localStorage.setItem('sig_master_logs', JSON.stringify(masterLogs));

        // Redirigir al Mapa Principal
        window.location.href = 'index.html';
      } else {
        errorDiv.style.display = 'block';
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
    }
  </script>
</body>
</html>
